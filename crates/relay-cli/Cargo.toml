[package]
name = "relay-cli"
description = "Relay native command-line executable"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
name = "relay_cli"
path = "src/lib.rs"

[[bin]]
name = "relay"
path = "src/main.rs"

[dependencies]
relay-app = { workspace = true }
relay-domain = { workspace = true }
relay-engine = { workspace = true }
relay-workflows = { workspace = true }
relay-config = { workspace = true }
relay-ui = { workspace = true }
relay-providers = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
ratatui = "0.29"
crossterm = "0.28"

[dev-dependencies]
tempfile = "3"
relay-executor = { workspace = true }
relay-providers = { workspace = true }
