[package]
name = "relay-tools"
description = "Workspace-bounded tool registry, path guard, filesystem, search, patch, process, git-read, and redaction for Relay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
relay-config = { workspace = true }
relay-domain = { workspace = true }
relay-providers = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
regex = "1"

# Runtime argument validation against each tool's JSON Schema (draft 2020-12).
# Default features are off: no network resolution, no macros.
jsonschema = { version = "0.58", default-features = false }

[target.'cfg(unix)'.dependencies]
# Safe process-group signaling (setpgid/killpg) for process-tree termination.
nix = { version = "0.31", features = ["signal"] }

[target.'cfg(windows)'.dependencies]
# Safe job-object wrapper: children are assigned to a kill-on-close job so a
# timeout or cancellation reaps the whole tree even if Relay itself dies.
win32job = "2"

[dev-dependencies]
tempfile = "3"
