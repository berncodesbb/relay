[package]
name = "relay-store"
description = "Canonical JSONL event storage, SQLite projections, and legacy migration for Relay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
relay-artifacts = { workspace = true }
relay-core = { workspace = true }
relay-domain = { workspace = true }
relay-workflows = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
rusqlite = { version = "0.40", features = ["bundled"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["signal"] }

[target.'cfg(windows)'.dependencies]
sysinfo = "0.39"

[dev-dependencies]
tempfile = "3"
