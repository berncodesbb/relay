name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo build --workspace --all-targets --all-features
      # Doc gate covers live crates only. relay-core and relay-runtime are
      # frozen reference material (no source edits until their retirement
      # change), so their doc warnings cannot be fixed in place.
      - run: cargo doc --workspace --all-features --no-deps --exclude relay-core --exclude relay-runtime
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Focused intent-first suites
        run: |
          cargo test -p relay-domain
          cargo test -p relay-engine
          cargo test -p relay-workflows
          cargo test -p relay-executor
          cargo test --test intent_first_scenarios
          cargo test --test graph_properties
          cargo test --test fact_replay
          cargo test --test semantic_migration
          cargo test --test crash_recovery
          cargo test --test capability_security
          cargo test --test scheduling_concurrency
          cargo test --test cli_work_graph
          cargo test --test tui_work_graph
