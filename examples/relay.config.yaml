# Example Relay configuration — a complete project layer.
#
# Copy this file to your workspace root as `relay.config.yaml` (or use this
# directory directly: `relay --workspace <repo>/examples config show`).
# Layers merge as defaults < ~/.config/relay/config.yaml < this file <
# invocation flags; every field below is explained in docs/configuration.md.
#
# This file contains NO credentials: `apiKeyEnv` names the environment
# variable that holds each key (values are read at run time and never
# persisted, logged, or echoed).
#
# Anthropic Messages is Relay's only live external protocol. The former
# `openai`/`glm` openai-chat connections were removed; configurations naming
# them fail with migration guidance (see docs/configuration.md).

version: 2

# ---------------------------------------------------------------------------
# Provider connections: named infrastructure you point roles at.
# Several connections may share one adapter; names are lowercase kebab-case.
# ---------------------------------------------------------------------------
providers:
  # The canonical Anthropic connection (adapter inferred on this legacy key).
  anthropic:
    apiKeyEnv: ANTHROPIC_API_KEY

  # An Anthropic Messages-compatible gateway — pure configuration, no extra
  # adapter. Explicit capability overrides win over the adapter defaults.
  gateway:
    adapter: anthropic
    baseUrl: https://gateway.example/anthropic
    apiKeyEnv: GATEWAY_API_KEY
    # Explicit capability overrides are the highest-precedence source. Here:
    # pin structured output to the json-object translation (the JSON Schema
    # embedded in the system prompt) for an endpoint without native support.
    capabilities:
      structuredOutput: json-object

  # A second anthropic connection (any Messages-compatible endpoint, e.g. a
  # local proxy) — coexists with the others; nothing is vendor-specific about
  # the adapter.
  local:
    adapter: anthropic
    baseUrl: http://localhost:8787
    apiKeyEnv: LOCAL_GATEWAY_KEY

  # The offline deterministic connection (explicit here; the built-in
  # defaults define it implicitly). Ignores baseUrl and credentials.
  fake:
    adapter: fake

# ---------------------------------------------------------------------------
# Model roles: execution responsibilities you name. Keys are yours; the
# five below are the built-in names, redefined here against live
# connections. A layer that names a role replaces its whole definition.
# ---------------------------------------------------------------------------
models:
  reasoning:  { provider: anthropic, model: claude-sonnet-5-5 }
  architect:  { provider: anthropic, model: claude-opus-5-5 }

  coding:
    provider: gateway
    model: claude-sonnet-5-5
    limits: { maxOutputTokens: 16384, temperature: 0.2 }
    fallbacks: [reasoning, fast]        # role names, tried in order (max 3)

  review:
    provider: gateway
    model: claude-sonnet-5-5
    fallbacks: [reasoning]              # e.g. the gateway is down -> Anthropic

  fast:
    provider: anthropic
    model: claude-haiku-4-5

  # A custom role of your own — the name describes the responsibility,
  # never a vendor or a vague quality.
  security-review:
    provider: anthropic
    model: claude-sonnet-5-5
    limits: { temperature: 0 }

# ---------------------------------------------------------------------------
# Routing: why a model call happens -> the role that serves it.
# The seven workflow modes are required in every layer; `intent` serves
# conversational turns. Values are role names; legacy inline objects
# ({ provider, model }) still work too.
# ---------------------------------------------------------------------------
routing:
  intent: fast                          # workspace chat / --print turns
  discovery: reasoning
  specification: reasoning
  technical-design: architect
  planning: reasoning
  implementation: coding
  verification: security-review         # a custom role can own a purpose
  delivery: fast

# ---------------------------------------------------------------------------
# Run budgets and tool settings (every field has a default; `budgets: {}`
# is valid). Ranges shown inline.
# ---------------------------------------------------------------------------
budgets:
  maxTurns: 24              # agent-loop turns per run        (1 .. 500)
  maxModelCalls: 48         # model calls per run              (1 .. 2,000)
  maxToolCalls: 96          # tool executions per run          (1 .. 2,000)
  maxOutputTokens: 400000   # output tokens per run            (1,024 .. 10,000,000)
  wallClockMs: 1800000      # 30-minute wall-clock deadline    (10,000 .. 86,400,000)
  maxRepeatedActions: 3     # identical tool calls allowed     (2 .. 20)

autonomy: next-checkpoint   # off | next-checkpoint | workflow | until:<mode>

tools:
  commandTimeoutMs: 120000  # child-process timeout            (1,000 .. 600,000)
  maxSearchResults: 200     # search results cap               (1 .. 10,000)
  maxFileBytes: 2000000     # max file read size               (1,024 .. 20,000,000)
