[workspace]
resolver = "3"
members = [
  "crates/relay-core",
  "crates/relay-store",
  "crates/relay-artifacts",
  "crates/relay-config",
  "crates/relay-providers",
  "crates/relay-tools",
  "crates/relay-runtime",
  "crates/relay-ui",
  "crates/relay-cli",
  "crates/relay-tests",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"

# Shared dependency versions. Crate owners add crate-specific dependencies to
# their own manifests; only versions shared by multiple crates belong here.
[workspace.dependencies]
relay-core = { path = "crates/relay-core", version = "0.2.0" }
relay-store = { path = "crates/relay-store", version = "0.2.0" }
relay-artifacts = { path = "crates/relay-artifacts", version = "0.2.0" }
relay-config = { path = "crates/relay-config", version = "0.2.0" }
relay-providers = { path = "crates/relay-providers", version = "0.2.0" }
relay-tools = { path = "crates/relay-tools", version = "0.2.0" }
relay-runtime = { path = "crates/relay-runtime", version = "0.2.0" }
relay-ui = { path = "crates/relay-ui", version = "0.2.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }

# Lints shared by every crate. Crate manifests opt in via `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
